<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060c">
<title>ORBIT</title>
<link rel="preload" href="chakra-petch-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Chakra Petch"; font-weight: 600; src: url(chakra-petch-600.woff2) format("woff2"); font-display: block; }
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" aria-label="ORBIT: tap when the ship meets the target"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, R, CX, CY;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.min(W * 0.34, H * 0.27);
  CX = W / 2; CY = H * 0.5;
  buildGrid();
}

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const easeOutQuart = t => 1 - Math.pow(1 - clamp(t, 0, 1), 4);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const UI_FONT = '"Chakra Petch", system-ui, sans-serif';

// ---------- persistence ----------
const store = {
  // falls back to the old 'halo_' keys so existing best scores carry over
  get(k, d) { try { const v = localStorage.getItem('orbit_' + k) ?? localStorage.getItem('halo_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('orbit_' + k, JSON.stringify(v)); } catch {} }
};
let best = store.get('best_v2', 0);
let plays = store.get('plays', 0);
let muted = store.get('muted', false);

// ---------- ranks: each one recolours the grid and adds a music layer ----------
const RANKS = [
  { at: 0,   name: 'SPARK',    l: 0.74, c: 0.16, h: 245 },
  { at: 10,  name: 'BRONZE',   l: 0.76, c: 0.16, h: 52 },
  { at: 20,  name: 'SILVER',   l: 0.86, c: 0.05, h: 250 },
  { at: 30,  name: 'GOLD',     l: 0.86, c: 0.17, h: 92 },
  { at: 45,  name: 'PLATINUM', l: 0.82, c: 0.17, h: 160 },
  { at: 60,  name: 'DIAMOND',  l: 0.82, c: 0.13, h: 205 },
  { at: 80,  name: 'MASTER',   l: 0.68, c: 0.21, h: 22 },
  { at: 100, name: 'NOVA',     l: 0.78, c: 0.18, h: 330, cycle: true },
];
const rankIndexFor = s => { let r = 0; RANKS.forEach((k, i) => { if (s >= k.at) r = i; }); return r; };

// enemy-style targets, Geometry Wars wireframes
const ENEMIES = {
  diamond:  'oklch(0.8 0.15 225)',
  square:   'oklch(0.86 0.21 145)',
  tri:      'oklch(0.8 0.17 55)',
  cross:    'oklch(0.75 0.2 352)',
  pinwheel: 'oklch(0.72 0.2 305)',
};
const STATIC_KINDS = ['diamond', 'square', 'tri', 'cross'];
const SHIP = 'oklch(0.96 0.05 95)', EXHAUST = 'oklch(0.78 0.17 55)', GOLDEN = 'oklch(0.9 0.17 95)';
const C = {};
let world = { l: RANKS[0].l, c: RANKS[0].c, h: RANKS[0].h }, worldFrom = { ...world }, worldTo = { ...world }, worldT = 1, worldCycle = false;
function setWorld(i, instant) {
  worldFrom = { ...world }; worldTo = { l: RANKS[i].l, c: RANKS[i].c, h: RANKS[i].h }; worldT = instant ? 1 : 0;
  worldCycle = !!RANKS[i].cycle;
  if (instant) world = { ...worldTo };
}
function computeColors() {
  const { l, c } = world;
  const h = worldCycle && worldT >= 1 ? (world.h + T * 40) % 360 : world.h;
  const ok = (L, Ch, a = 1, hh = h) => `oklch(${clamp(L, 0, 1).toFixed(3)} ${Math.max(0, Ch).toFixed(3)} ${hh.toFixed(1)} / ${a})`;
  C.neon = ok(l, c);
  C.neonSoft = ok(l - 0.1, c * 0.9);
  C.bg = ok(0.11, 0.025);
  C.bgDeep = ok(0.06, 0.015);
  C.grid = ok(0.6, c * 0.85);
  C.gridMajor = ok(0.7, c);
  C.ink = ok(0.97, 0.012);
  C.inkSoft = ok(0.8, 0.045);
  C.dim = 'rgba(2,3,8,0.62)';
}

// ---------- the warp grid: a spring mesh that ripples on hits and on the beat ----------
let grid = null;
function buildGrid() {
  const sp = clamp(Math.min(W, H) / 13, 28, 56);
  const cols = Math.ceil(W / sp) + 3, rows = Math.ceil(H / sp) + 3, n = cols * rows;
  grid = { sp, cols, rows, ox: (W - (cols - 1) * sp) / 2, oy: (H - (rows - 1) * sp) / 2,
    dx: new Float32Array(n), dy: new Float32Array(n), vx: new Float32Array(n), vy: new Float32Array(n) };
}
function gridImpulse(x, y, radius, strength) {
  if (!grid) return;
  const { sp, cols, rows, ox, oy, dx, dy, vx, vy } = grid;
  for (let j = 1; j < rows - 1; j++) for (let i = 1; i < cols - 1; i++) {
    const k = j * cols + i;
    const px = ox + i * sp + dx[k] - x, py = oy + j * sp + dy[k] - y;
    const d = Math.hypot(px, py);
    if (d < radius && d > 0.001) { const f = strength * (1 - d / radius); vx[k] += px / d * f; vy[k] += py / d * f; }
  }
}
function gridStep(dt) {
  const { cols, rows, sp, dx, dy, vx, vy } = grid;
  const K = 30, KN = 60, DAMP = 5, lim = sp * 1.4;
  const steps = 2, h = dt / steps;
  for (let s = 0; s < steps; s++) {
    for (let j = 1; j < rows - 1; j++) for (let i = 1; i < cols - 1; i++) {
      const k = j * cols + i;
      const lx = dx[k - 1] + dx[k + 1] + dx[k - cols] + dx[k + cols] - 4 * dx[k];
      const ly = dy[k - 1] + dy[k + 1] + dy[k - cols] + dy[k + cols] - 4 * dy[k];
      vx[k] += (-K * dx[k] + KN * lx - DAMP * vx[k]) * h;
      vy[k] += (-K * dy[k] + KN * ly - DAMP * vy[k]) * h;
    }
    for (let k = 0; k < dx.length; k++) {
      dx[k] = clamp(dx[k] + vx[k] * h, -lim, lim);
      dy[k] = clamp(dy[k] + vy[k] * h, -lim, lim);
    }
  }
}

// ---------- audio: a tiny synth + step sequencer driven by one clock ----------
const BPM = 128, BEAT = 60 / BPM, STEP = BEAT / 4;
const PROG = [ // Am  F  C  G  (one chord per bar)
  { root: 45, tones: [57, 60, 64] },
  { root: 41, tones: [57, 60, 65] },
  { root: 48, tones: [55, 60, 64] },
  { root: 43, tones: [55, 59, 62] },
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let AC = null, master, comp, musicFilter, musicBus, duckBus, sfxBus, delaySend, noiseBuf;
const seq = { running: false, t0: 0, next: 0 };
let musicLevel = 0, streakLayer = false;

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return AC; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' }); } catch { return null; }
  comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  master = AC.createGain(); master.gain.value = muted ? 0 : 0.85;
  comp.connect(master); master.connect(AC.destination);
  musicFilter = AC.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 20000; musicFilter.Q.value = 0.7;
  musicFilter.connect(comp);
  musicBus = AC.createGain(); musicBus.gain.value = 0.9; musicBus.connect(musicFilter);
  duckBus = AC.createGain(); duckBus.connect(musicBus);
  sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(comp);
  // dotted-eighth echo for plucks
  const dl = AC.createDelay(1); dl.delayTime.value = STEP * 3;
  const fb = AC.createGain(); fb.gain.value = 0.32;
  const wet = AC.createGain(); wet.gain.value = 0.28;
  const dlf = AC.createBiquadFilter(); dlf.type = 'lowpass'; dlf.frequency.value = 3200;
  delaySend = AC.createGain();
  delaySend.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(wet); wet.connect(comp);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  setInterval(schedule, 25);
  return AC;
}
function env(g, t, peak, a, dec) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function osc(type, f, t, dur, out) {
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  o.connect(out); o.start(t); o.stop(t + dur + 0.05); return o;
}
function noise(t, dur, out) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05); return s;
}
function kick(t) {
  const g = AC.createGain(); g.connect(musicBus); env(g, t, 1.0, 0.002, 0.32);
  const o = osc('sine', 160, t, 0.35, g); o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
  const cg = AC.createGain(); cg.connect(musicBus); env(cg, t, 0.25, 0.001, 0.015);
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500; hp.connect(cg); noise(t, 0.02, hp);
  // sidechain pump
  duckBus.gain.cancelScheduledValues(t);
  duckBus.gain.setValueAtTime(0.25, t);
  duckBus.gain.linearRampToValueAtTime(1, t + BEAT * 0.55);
}
function hat(t, open, vol = 0.18) {
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
  const g = AC.createGain(); hp.connect(g); g.connect(musicBus); env(g, t, vol, 0.001, open ? 0.14 : 0.035);
  noise(t, open ? 0.2 : 0.06, hp);
}
function clap(t) {
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.9;
  const g = AC.createGain(); bp.connect(g); g.connect(musicBus);
  g.gain.setValueAtTime(0.0001, t);
  [0, 0.012, 0.024].forEach(o => { g.gain.setValueAtTime(0.5, t + o); g.gain.exponentialRampToValueAtTime(0.08, t + o + 0.01); });
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  noise(t, 0.25, bp);
}
function bass(t, m) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 6;
  lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(220, t + 0.16);
  const g = AC.createGain(); lp.connect(g); g.connect(duckBus); env(g, t, 0.42, 0.004, 0.2);
  osc('sawtooth', mtof(m), t, 0.22, lp);
  osc('square', mtof(m - 12), t, 0.22, lp);
}
function pluck(t, m, vol, out, send = 0.5) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 3;
  lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(700, t + 0.14);
  const g = AC.createGain(); lp.connect(g); g.connect(out); env(g, t, vol, 0.002, 0.16);
  if (send) { const s = AC.createGain(); s.gain.value = send; g.connect(s); s.connect(delaySend); }
  osc('square', mtof(m), t, 0.2, lp);
  const o2 = osc('sawtooth', mtof(m), t, 0.2, lp); o2.detune.value = 9;
}
function pad(t, tones, dur) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
  const g = AC.createGain(); lp.connect(g); g.connect(duckBus);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07, t + 0.08);
  g.gain.setValueAtTime(0.07, t + dur - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  tones.forEach(m => [-7, 7].forEach(dt => { const o = osc('sawtooth', mtof(m - 12), t, dur, lp); o.detune.value = dt; }));
}
function bell(t, m, vol = 0.12) {
  const g = AC.createGain(); g.connect(sfxBus); env(g, t, vol, 0.002, 0.5);
  const s = AC.createGain(); s.gain.value = 0.6; g.connect(s); s.connect(delaySend);
  osc('sine', mtof(m), t, 0.55, g);
  const g2 = AC.createGain(); g2.connect(sfxBus); env(g2, t, vol * 0.3, 0.001, 0.12);
  osc('sine', mtof(m) * 4.02, t, 0.15, g2);
}

function playStep(n, t) {
  const s = n % 16, bar = Math.floor(n / 16), ch = PROG[bar % 4], L = musicLevel;
  if (s % 4 === 0) kick(t);
  if (s % 4 === 2) { bass(t, ch.root); hat(t, true, 0.12); }
  if (L >= 1 && (s === 4 || s === 12)) clap(t);
  if (L >= 2 && s % 2 === 0) { const seqIdx = (s / 2) % 4; const m = [ch.tones[0], ch.tones[1], ch.tones[2], ch.tones[1]][seqIdx] + 12; pluck(t, m, 0.07, duckBus, 0.35); }
  if (L >= 3 && s === 0) pad(t, ch.tones, BEAT * 4);
  if (L >= 4 && s % 2 === 1) hat(t, false, 0.07);
  if (L >= 5 && s % 2 === 1) pluck(t, ch.tones[(s >> 1) % 3] + 24, 0.035, duckBus, 0.5);
  if (L >= 6 && s === 14 && bar % 2 === 1) { clap(t); }
  if (streakLayer && s % 4 === 3) bell(t, ch.tones[(s >> 2) % 3] + 24, 0.05);
}
function schedule() {
  if (!AC || !seq.running) return;
  const ahead = AC.currentTime + 0.12;
  while (seq.t0 + seq.next * STEP < ahead) { playStep(seq.next, seq.t0 + seq.next * STEP); seq.next++; }
}
function startMusic() {
  if (!AC) return;
  const t = AC.currentTime;
  musicFilter.frequency.cancelScheduledValues(t); musicFilter.frequency.setValueAtTime(20000, t);
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(0.9, t);
  seq.t0 = t + 0.15; seq.next = 0; seq.running = true;
}
function stopMusic() {
  if (!AC) return;
  seq.running = false;
  const t = AC.currentTime;
  musicFilter.frequency.cancelScheduledValues(t);
  musicFilter.frequency.setValueAtTime(musicFilter.frequency.value, t);
  musicFilter.frequency.exponentialRampToValueAtTime(140, t + 0.45);
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t);
  musicBus.gain.linearRampToValueAtTime(0, t + 0.6);
}
// clock: what the player hears right now, in seconds since the song started
function clockNow() {
  if (AC) return AC.currentTime - (AC.outputLatency || AC.baseLatency || 0);
  return performance.now() / 1000;
}
const musicTime = () => clockNow() - seq.t0;
function currentChord() { const mt = Math.max(0, musicTime()); return PROG[Math.floor(mt / (BEAT * 4)) % 4]; }

function sfxHit(combo, perfect) {
  if (!AC) return;
  const t = AC.currentTime, ch = currentChord();
  const ladder = [ch.tones[0], ch.tones[1], ch.tones[2], ch.tones[0] + 12, ch.tones[1] + 12, ch.tones[2] + 12, ch.tones[0] + 24];
  const m = ladder[Math.min(combo - 1, ladder.length - 1)] + 12;
  pluck(t, m, perfect ? 0.2 : 0.15, sfxBus, 0.45);
  const g = AC.createGain(); g.connect(sfxBus); env(g, t, 0.18, 0.001, 0.025);
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4000; hp.connect(g); noise(t, 0.04, hp);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.5;
  lp.frequency.setValueAtTime(perfect ? 7000 : 4500, t); lp.frequency.exponentialRampToValueAtTime(180, t + 0.28);
  const eg = AC.createGain(); lp.connect(eg); eg.connect(sfxBus); env(eg, t, perfect ? 0.34 : 0.26, 0.002, 0.3);
  noise(t, 0.35, lp);
  const tg = AC.createGain(); tg.connect(sfxBus); env(tg, t, 0.3, 0.002, 0.16);
  const th = osc('sine', 140, t, 0.2, tg); th.frequency.exponentialRampToValueAtTime(48, t + 0.15);
  if (perfect) bell(t + 0.01, m + 12, 0.1);
}
function sfxRankUp() {
  if (!AC) return;
  const t = AC.currentTime, ch = currentChord();
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
  bp.frequency.setValueAtTime(600, t); bp.frequency.exponentialRampToValueAtTime(7000, t + 0.35);
  const g = AC.createGain(); bp.connect(g); g.connect(sfxBus);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  noise(t, 0.55, bp);
  ch.tones.forEach((m, i) => bell(t + 0.3 + i * 0.04, m + 12, 0.09));
}
function sfxBest() {
  if (!AC) return;
  const t = AC.currentTime, ch = currentChord();
  [0, 1, 2, 0].forEach((k, i) => bell(t + i * STEP, ch.tones[k] + (i === 3 ? 36 : 24), 0.08));
}
function sfxDie() {
  if (!AC) return;
  const t = AC.currentTime;
  const g = AC.createGain(); g.connect(sfxBus); env(g, t, 0.35, 0.002, 0.5);
  const o = osc('sawtooth', 330, t, 0.55, g); o.frequency.exponentialRampToValueAtTime(55, t + 0.5);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(6000, t); lp.frequency.exponentialRampToValueAtTime(300, t + 0.6);
  const g2 = AC.createGain(); lp.connect(g2); g2.connect(sfxBus); env(g2, t, 0.45, 0.002, 0.7);
  noise(t, 0.8, lp);
}
function sfxTap() { // UI tap for menus
  if (!AC) return;
  const t = AC.currentTime;
  const g = AC.createGain(); g.connect(sfxBus); env(g, t, 0.2, 0.002, 0.08);
  const o = osc('triangle', 660, t, 0.1, g); o.frequency.exponentialRampToValueAtTime(990, t + 0.06);
}
function setMuted(m) {
  muted = m; store.set('muted', muted);
  if (AC) master.gain.setTargetAtTime(muted ? 0 : 0.85, AC.currentTime, 0.02);
}
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch {} }


// ---------- game state ----------
const S = { MENU: 0, PLAY: 1, DYING: 2, OVER: 3, PAUSED: 4 };
let state = S.MENU;
let score = 0, combo = 0, perfectStreak = 0, angle = -Math.PI / 2, dir = 1, speed = 2.7, remaining = 1, target = null, hits = 0;
let rankIdx = 0, simT = 0, deadAt = 0, overT = 0, newBest = false, prevBest = 0, runStartT = 0, lastBeat = -1;
let shake = 0, flash = 0, ringPulse = 0, scorePop = 0;
let sparks = [], floaters = [], waves = [];
let banner = null;
let T = 0;

const closing = () => speed - (target ? target.drift * 0.6 : 0);

function newTarget() {
  const drift = score >= 22 && Math.random() < clamp((score - 20) / 60, 0, 0.45) ? rand(0.5, 1.1) * (Math.random() < 0.5 ? -1 : 1) : 0;
  const kind = drift ? 'pinwheel' : STATIC_KINDS[Math.floor(Math.random() * STATIC_KINDS.length)];
  target = { drift, kind, born: 0, arrive: 0, spin: rand(0, TAU) };
  const close = closing(), now = musicTime();
  // minimum gap: at least 80° and ~0.42s of travel, so there's always time to react
  const minT = Math.max(1.4 / speed, 0.42);
  const maxT = Math.max(minT + 0.5, TAU * 0.72 / close);
  // targets land on the beat grid: quarter notes early, eighth notes later
  const g = score < 15 ? BEAT : BEAT / 2;
  const kMin = Math.ceil((now + minT) / g), kMax = Math.max(kMin, Math.floor((now + maxT) / g));
  target.arrive = (kMin + Math.floor(Math.random() * (kMax - kMin + 1))) * g;
  remaining = close * (target.arrive - now);
}

function hitWindow() {
  return Math.atan2(R * 0.085, R) * 1.35 * clamp(1.05 - score * 0.0025, 0.75, 1.05);
}

function startRun() {
  initAudio();
  score = 0; combo = 0; perfectStreak = 0; hits = 0; rankIdx = 0;
  angle = -Math.PI / 2; dir = 1; speed = 2.7;
  shake = 0; flash = 0; ringPulse = 0; scorePop = 0;
  newBest = false; prevBest = best; overT = 0; deadAt = 0; lastBeat = -1;
  floaters = []; waves = []; banner = null;
  musicLevel = 0; streakLayer = false;
  setWorld(0, false);
  plays++; store.set('plays', plays);
  startMusic();
  simT = musicTime(); runStartT = simT;
  newTarget();
  state = S.PLAY;
}

function targetAngle() { return angle + dir * remaining; }
function ringPos(a, r = R) { return [CX + Math.cos(a) * r, CY + Math.sin(a) * r]; }

function burst(x, y, n, colors, spd = 500, life = 0.8, w = 2) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = spd * Math.pow(Math.random(), 0.6);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * rand(0.5, 1), max: life, col: colors[i % colors.length], w });
  }
  if (sparks.length > 1600) sparks.splice(0, sparks.length - 1600);

function advance() {

  const now = musicTime();
  const dt = now - simT;
  if (dt <= 0) return;
  simT = now;
  angle += dir * speed * dt;
  remaining -= closing() * dt;
  target.born += dt;
  if (remaining < -hitWindow()) die('late');

  initAudio();

  if (state === S.OVER) { if (overT > 0.4) { sfxTap(); startRun(); } return; }
  if (state === S.PAUSED) { resume(); return; }
  if (state !== S.PLAY) return;
  advance();
  if (state !== S.PLAY) return;

  const hw = hitWindow();
  if (Math.abs(remaining) > hw) { die(remaining > 0 ? 'early' : 'late'); return; }

  const perfect = Math.abs(remaining) <= hw * 0.33;
  const [tx, ty] = ringPos(targetAngle());
  combo++; hits++; score++;
  perfectStreak = perfect ? perfectStreak + 1 : 0;
  streakLayer = perfectStreak >= 5;

  const col = ENEMIES[target.kind];
  burst(tx, ty, perfect ? 70 : 40, [col, col, C.ink], perfect ? 800 : 600, 0.6, perfect ? 2.2 : 1.8);
  waves.push({ x: tx, y: ty, r: R * 0.06, life: 0.5, max: 0.5, col });
  if (!reducedMotion) gridImpulse(tx, ty, R * (perfect ? 1.3 : 0.95), perfect ? 900 : 600);
  const ta = targetAngle(); // pop-ups sit just outside the ring, away from the score
  if (perfect) floater(perfectStreak >= 5 ? `PERFECT X${perfectStreak}` : 'PERFECT', CX + Math.cos(ta) * R * 1.32, CY + Math.sin(ta) * R * 1.32, col, Math.max(13, R * 0.085));

    sfxRankUp();
    if (!reducedMotion) gridImpulse(CX, CY, Math.max(W, H), 1400);
    burst(CX, CY, 160, [ENEMIES.square, ENEMIES.diamond, ENEMIES.cross, GOLDEN, ENEMIES.tri], 1100, 1.2, 2.2);

  burst(x, y, 260, [SHIP, EXHAUST, C.neon, '#fff'], 1200, 1.4, 2.4);
  if (!reducedMotion) gridImpulse(x, y, R * 2.6, 2200);

function pause() { if (state !== S.PLAY) return; state = S.PAUSED; if (AC) AC.suspend(); }
function resume() { if (AC) AC.resume(); state = S.PLAY; }
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- input ----------
function inMute(x, y) { return x > W - 70 && y < 70; }
addEventListener('pointerdown', e => {

  e.preventDefault(); tap();
}, { passive: false });
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (['Space', 'Enter', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); tap(); }
  else if (e.code === 'KeyM') { initAudio(); setMuted(!muted); }
  else if (e.code === 'Escape' || e.code === 'KeyP') { state === S.PAUSED ? resume() : pause(); }

addEventListener('resize', resize); resize();

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const rdt = Math.min((now - last) / 1000, 0.05); last = now; T += rdt;
  advance();
  update(rdt);
  computeColors();
  draw();
  requestAnimationFrame(frame);
}

function update(rdt) {
  if (state === S.DYING) { deadAt += rdt; if (deadAt > 0.85) { state = S.OVER; overT = 0; } }
  if (state === S.OVER) overT += rdt;
  if (state === S.MENU) angle += 1.6 * rdt;

  if (worldT < 1) {
    worldT = Math.min(1, worldT + rdt / 0.6);
    const k = easeOutQuart(worldT);
    let dh = worldTo.h - worldFrom.h; if (dh > 180) dh -= 360; if (dh < -180) dh += 360;
    world = { l: lerp(worldFrom.l, worldTo.l, k), c: lerp(worldFrom.c, worldTo.c, k), h: (worldFrom.h + dh * k + 360) % 360 };
  }
  if (state === S.PAUSED) return;

  // the grid breathes with the kick drum
  if (state === S.PLAY && seq.running) {
    const b = Math.floor(musicTime() / BEAT);
    if (b !== lastBeat && b >= 0) { lastBeat = b; if (!reducedMotion) gridImpulse(CX, CY, R * 1.9, b % 4 === 0 ? 220 : 120); }
  }
  gridStep(rdt);

  // ship exhaust
  if (state === S.PLAY || state === S.MENU) {
    const [x, y] = ringPos(angle);
    for (let i = 0; i < 2; i++) {
      const v = rand(60, 160);
      const tx = -Math.sin(angle) * (state === S.MENU ? 1 : dir), ty = Math.cos(angle) * (state === S.MENU ? 1 : dir);
      sparks.push({ x: x - tx * R * 0.05, y: y - ty * R * 0.05, vx: -tx * v + rand(-40, 40), vy: -ty * v + rand(-40, 40), life: rand(0.15, 0.3), max: 0.3, col: EXHAUST, w: 1.6 });
    }
  }
  for (const p of sparks) {
    p.x += p.vx * rdt; p.y += p.vy * rdt;
    const f = 1 - 2.6 * rdt; p.vx *= f; p.vy *= f;
    if (p.x < 0 || p.x > W) { p.vx *= -0.6; p.x = clamp(p.x, 0, W); }
    if (p.y < 0 || p.y > H) { p.vy *= -0.6; p.y = clamp(p.y, 0, H); }
    p.life -= rdt;
  }
  sparks = sparks.filter(p => p.life > 0);
  for (const f of floaters) f.t += rdt;
  floaters = floaters.filter(f => f.t < 0.9);
  for (const w of waves) { w.life -= rdt; w.r += rdt * R * 1.6; }
  waves = waves.filter(w => w.life > 0);
  if (banner) { banner.t += rdt; if (banner.t > 1.6) banner = null; }

  flash = Math.max(0, flash - rdt * 3);
  ringPulse = Math.max(0, ringPulse - rdt * 5);
  scorePop = Math.max(0, scorePop - rdt * 6);
}

// beat pulse 0..1, peaks on each kick
function beatPulse() {
  if (state === S.PLAY || state === S.DYING) {
    const mt = musicTime(); if (mt < 0 || !seq.running) return 0;
    return Math.exp(-((mt / BEAT) % 1) * 7) * (reducedMotion ? 0.3 : 1);
  }
  return reducedMotion ? 0 : Math.pow(Math.max(0, Math.sin(T * Math.PI * BPM / 60)), 8) * 0.6;

// ---------- neon drawing ----------

  '9': [[4,3,0,3,0,0,4,0,4,6,0,6]],
  A: [[0,6,0,1,1,0,3,0,4,1,4,6],[0,3,4,3]], B: [[0,0,3,0,4,1,4,2,3,3,0,3],[3,3,4,4,4,5,3,6,0,6,0,0]],
  C: [[4,0,0,0,0,6,4,6]], D: [[0,0,3,0,4,1,4,5,3,6,0,6,0,0]], E: [[4,0,0,0,0,6,4,6],[0,3,3,3]],

  P: [[0,6,0,0,4,0,4,3,0,3]], Q: [[0,0,4,0,4,6,0,6,0,0],[2,4,4,6]], R: [[0,6,0,0,4,0,4,3,0,3,4,6]],

function drawBackground() {
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.hypot(W, H) * 0.6);
  g.addColorStop(0, C.bg); g.addColorStop(1, C.bgDeep);

  const { sp, cols, rows, ox, oy, dx, dy } = grid;
  const minor = new Path2D(), major = new Path2D();
  for (let j = 0; j < rows; j++) {
    const p = j % 4 === 0 ? major : minor;
    for (let i = 0; i < cols; i++) { const k = j * cols + i, x = ox + i * sp + dx[k], y = oy + j * sp + dy[k]; i ? p.lineTo(x, y) : p.moveTo(x, y); }
  }
  for (let i = 0; i < cols; i++) {
    const p = i % 4 === 0 ? major : minor;
    for (let j = 0; j < rows; j++) { const k = j * cols + i, x = ox + i * sp + dx[k], y = oy + j * sp + dy[k]; j ? p.lineTo(x, y) : p.moveTo(x, y); }
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = C.grid;
  ctx.globalAlpha = 0.035; ctx.lineWidth = 4; ctx.stroke(minor);
  ctx.globalAlpha = 0.11; ctx.lineWidth = 1; ctx.stroke(minor);

  ctx.globalAlpha = 0.22; ctx.lineWidth = 1.4; ctx.stroke(major);
  ctx.restore();

  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawRing(pulse) {
  const r0 = R + ringPulse * 4;
  // dark core so the ring reads against the grid
  const lane = Math.max(R * 0.09, 14);
  ctx.save();
  ctx.fillStyle = 'rgba(2,3,8,0.6)'; ctx.beginPath(); ctx.arc(CX, CY, r0 - lane, 0, TAU); ctx.fill();

  ctx.restore();

  neon(circlePath(CX, CY, r0 - lane), C.neon, 1.6, 0.45 + pulse * 0.25);

function enemyPath(kind, x, y, r, t) {
  const p = new Path2D();
  const rot = (pts, a) => pts.map(([px, py]) => [x + px * Math.cos(a) - py * Math.sin(a), y + px * Math.sin(a) + py * Math.cos(a)]);

    const sx = 0.7 + Math.sin(t * 7) * 0.18;
    poly([[x, y - r * 1.25], [x + r * sx, y], [x, y + r * 1.25], [x - r * sx, y]], true, p);
  } else if (kind === 'square') {
    poly(rot([[-r, -r], [r, -r], [r, r], [-r, r]], t * 1.6), true, p);
    poly(rot([[0, -r], [r, 0], [0, r], [-r, 0]], t * 1.6), true, p);
  } else if (kind === 'tri') {
    poly(rot([[0, -r * 1.2], [r * 1.05, r * 0.65], [-r * 1.05, r * 0.65]], t * 2.2), true, p);

function drawTarget(dead) {
  const [tx, ty] = ringPos(targetAngle());
  const appear = easeOutExpo(clamp(target.born * 5, 0, 1));
  const r = Math.max(R * 0.1, 13) * appear;
  const col = ENEMIES[target.kind];
  if (!dead) {
    // approach ring closes exactly on arrival
    const left = target.arrive - musicTime();
    const k = clamp(left / 0.8, 0, 1);
    if (k < 1) neon(circlePath(tx, ty, r * (1.4 + k * 2.2)), C.ink, 2.2, 0.25 + (1 - k) * 0.75);

  neon(enemyPath(target.kind, tx, ty, r, T + target.spin), col, 2.6, dead ? 0.35 : 1);
}

function shipPath(a, d, scale = 1) {
  const [x, y] = ringPos(a);
  const s = Math.max(R * 0.12, 15) * scale;
  const hd = a + d * Math.PI / 2;
  const c = Math.cos(hd), sn = Math.sin(hd);
  const pts = [[1, 0], [-0.55, -0.72], [-0.15, -0.2], [-0.4, 0], [-0.15, 0.2], [-0.55, 0.72]].map(([px, py]) => [x + (px * c - py * sn) * s, y + (px * sn + py * c) * s]);
  return poly(pts);
}

function drawMuteIcon() {
  const x = W - 38, y = 36, s = 11;
  const p = poly([[x - s, y - s * 0.4], [x - s * 0.45, y - s * 0.4], [x + s * 0.15, y - s], [x + s * 0.15, y + s], [x - s * 0.45, y + s * 0.4], [x - s, y + s * 0.4]]);
  if (muted) { p.moveTo(x + s * 0.55, y - s * 0.45); p.lineTo(x + s * 1.3, y + s * 0.45); p.moveTo(x + s * 1.3, y - s * 0.45); p.lineTo(x + s * 0.55, y + s * 0.45); }

  neon(p, C.inkSoft, 1.5, 0.8);
}

// rank strip: what rank you're in, what's next, and how close you are

  const i = rankIndexFor(value), cur = RANKS[i], nxt = RANKS[i + 1];
  const x = cx - w / 2;

  label(cur.name, x + 44, y - 16, 13, C.neon, { align: 'left', alpha, spacing: '1px' });

    ctx.fillStyle = C.dim; ctx.fillRect(0, 0, W, H);
    vtext('PAUSED', CX, CY - 8, Math.max(28, R * 0.22), C.neon);
    label('Tap to resume', CX, CY + R * 0.3, 17, C.inkSoft);
  }
  drawMuteIcon();
}

function drawHud(pulse) {
  const bw = Math.min(W * 0.7, 400);
  if (state !== S.DYING) drawRankStrip(CX, Math.max(66, H * 0.085), bw, score);

  const sz = R * 0.36 * (1 + scorePop * 0.12 + pulse * 0.02);
  vtext(String(score), CX, CY, sz, state === S.DYING ? 'oklch(0.72 0.2 25)' : C.ink, { w: Math.max(2.5, sz * 0.08), glow: C.neon });

  label(newBest ? 'NEW BEST' : `BEST ${best}`, CX, CY - R * 0.4, Math.max(13, R * 0.08), newBest ? GOLDEN : C.inkSoft, { spacing: '2px' });

  // perfect streak: five diamonds
  const py = CY + R * 0.38, gap = R * 0.12, ds = R * 0.035;
  const p = new Path2D(), lit = new Path2D();
  for (let i = 0; i < 5; i++) {
    const x = CX + (i - 2) * gap, on = i < Math.min(perfectStreak, 5);
    const s = ds * (on && perfectStreak >= 5 ? 1 + pulse * 0.4 : 1);
    poly([[x, py - s], [x + s, py], [x, py + s], [x - s, py]], true, on ? lit : p);
  }
  neon(p, C.neonSoft, 1.2, 0.4);
  neon(lit, GOLDEN, 1.8, 1);

  const since = simT - runStartT;
  if (state === S.PLAY && (hits === 0 || since < 1.6)) {
    label(`ATTEMPT ${plays}`, CX, CY - R - R * 0.4, Math.max(14, R * 0.09), C.inkSoft, { spacing: '3px', alpha: hits === 0 ? 1 : clamp(1.6 - since, 0, 1) });
  }
  if (plays <= 2 && hits < 3 && state === S.PLAY) {
    label('Tap when the ship meets the target', CX, CY + R + R * 0.42, Math.max(15, R * 0.09), C.ink);
  }

  if (banner) {
    const t = banner.t;
    const inK = easeOutExpo(clamp(t / 0.4, 0, 1));
    const outK = t > 1.2 ? easeOutQuart((t - 1.2) / 0.4) : 0;
    const y = CY + R + R * 0.48;
    label('RANK UP', CX, y - R * 0.2, Math.max(12, R * 0.07), C.inkSoft, { spacing: '4px', alpha: inK * (1 - outK) });
    vtext(banner.text, CX, y, Math.max(26, R * 0.2) * (1.6 - 0.6 * inK), GOLDEN, { alpha: inK * (1 - outK), track: 2.5 });
  }
}

function playIcon(x, y, r, pulse) {
  neon(circlePath(x, y, r * (1 + pulse * 0.05)), C.neon, 2.2, 0.85);
  const k = r * 0.42;
  neon(poly([[x - k * 0.55, y - k], [x + k, y], [x - k * 0.55, y + k]]), C.ink, 2.4);
}
function retryIcon(x, y, r, pulse) {
  neon(circlePath(x, y, r * (1 + pulse * 0.05)), C.neon, 2.2, 0.85);
  const k = r * 0.44, a0 = -Math.PI / 2 + 0.55, a1 = a0 + TAU * 0.8;
  const p = new Path2D();
  p.moveTo(x + Math.cos(a0) * k, y + Math.sin(a0) * k); p.arc(x, y, k, a0, a1);
  // chevron at the end of the arc, pointing along the tangent
  const ex = x + Math.cos(a1) * k, ey = y + Math.sin(a1) * k;
  const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1), h = r * 0.24;
  p.moveTo(ex - tx * h * 0.55 + nx * h * 0.8, ey - ty * h * 0.55 + ny * h * 0.8);
  p.lineTo(ex + tx * h * 0.45, ey + ty * h * 0.45);
  p.lineTo(ex - tx * h * 0.55 - nx * h * 0.8, ey - ty * h * 0.55 - ny * h * 0.8);
  neon(p, C.ink, 2.4);
}

function drawMenu(pulse) {
  vtext('ORBIT', CX, CY - R - R * 0.55, Math.min(W * 0.14, R * 0.4, 84), C.neon, { track: 2.4 });
  playIcon(CX, CY, R * 0.3, pulse);
  label('Tap to play', CX, CY + R + R * 0.4, Math.max(17, R * 0.1), C.ink, { alpha: 0.65 + 0.35 * Math.sin(T * 4) });
  if (best > 0) label(`BEST ${best}  ·  ${RANKS[rankIndexFor(best)].name}`, CX, CY + R + R * 0.62, Math.max(13, R * 0.075), C.inkSoft, { spacing: '2px' });
}

function drawOver() {
  const k = easeOutQuart(overT / 0.35);
  ctx.fillStyle = 'rgba(2,3,8,0.78)'; ctx.globalAlpha = k; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;

  // layout, top to bottom, inside one panel
  const sh = Math.min(R * 0.55, 88);
  const pw = Math.min(W - 40, 340), pad = 26, inner = pw - pad * 2;
  const panelH = pad + 16 + 26 + sh + 28 + 18 + 24 + 1 + 24 + 42 + 22 + 6 + 12 + 14 + pad;
  const total = panelH + 130;
  const fit = Math.min(1, (H - 32) / total);
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(fit, fit); ctx.translate(-CX, -CY);
  const px = CX - pw / 2, py = CY - total / 2 + (1 - k) * 24;
  ctx.globalAlpha = k;

  // panel: solid fill, faint border, neon corner brackets
  ctx.fillStyle = 'rgba(5,6,12,0.94)'; ctx.fillRect(px, py, pw, panelH);
  const border = new Path2D(); border.rect(px, py, pw, panelH);
  neon(border, C.neonSoft, 1, 0.22);
  const L = 18, br = new Path2D();
  for (const [x, y, sx, sy] of [[px, py, 1, 1], [px + pw, py, -1, 1], [px, py + panelH, 1, -1], [px + pw, py + panelH, -1, -1]]) {
    br.moveTo(x, y + sy * L); br.lineTo(x, y); br.lineTo(x + sx * L, y);
  }
  neon(br, C.neon, 2.4);

  let y = py + pad + 8;
  label(`ATTEMPT ${plays}`, CX, y, 12, C.inkSoft, { spacing: '3px', alpha: k * 0.85 });
  y += 26 + sh / 2;
  vtext(String(score), CX, y, sh, newBest ? GOLDEN : C.ink, { alpha: 1, w: Math.max(3, sh * 0.07), glow: newBest ? GOLDEN : C.neon });
  y += sh / 2 + 28 + 9;
  if (newBest) {
    label('NEW BEST', CX, y, 15, GOLDEN, { spacing: '4px', alpha: k * (0.8 + 0.2 * Math.sin(T * 6)) });
  } else {
    const gap = best - score;
    const msg = best === 0 ? 'Tap as the ship meets the target' : gap === 0 ? 'Tied your best' : gap <= 3 ? `So close! ${gap} short of your best` : `${gap} short of your best`;
    label(msg, CX, y, 15, gap <= 3 && gap > 0 ? GOLDEN : C.inkSoft, { alpha: k });
  }
  y += 9 + 24;
  const div = new Path2D(); div.moveTo(px + pad, y); div.lineTo(px + pw - pad, y);
  neon(div, C.neonSoft, 1, 0.3);
  y += 1 + 24;

  // two columns: best and rank
  const i = rankIndexFor(best), cur = RANKS[i], nxt = RANKS[i + 1];
  const colL = px + pad, colR = px + pw - pad;
  label('BEST', colL, y + 6, 11, C.inkSoft, { align: 'left', spacing: '3px', alpha: k * 0.8 });
  label('RANK', colR, y + 6, 11, C.inkSoft, { align: 'right', spacing: '3px', alpha: k * 0.8 });
  label(String(best), colL, y + 30, 22, C.ink, { align: 'left', alpha: k });
  label(cur.name, colR, y + 30, 22, nxt ? C.neon : GOLDEN, { align: 'right', alpha: k, spacing: '1px' });
  y += 42 + 22;

  // progress to the next rank
  const prog = nxt ? clamp((best - cur.at) / (nxt.at - cur.at), 0, 1) : 1;
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(colL, y, inner, 6);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = nxt ? C.neon : GOLDEN; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
  ctx.fillRect(colL, y, inner * prog, 6); ctx.restore();
  y += 6 + 12 + 7;
  label(nxt ? `${nxt.at - best} more to ${nxt.name}` : 'Top rank reached', CX, y, 13, C.inkSoft, { alpha: k * 0.85 });

  // retry
  const by = py + panelH + 62;
  const bk = easeOutExpo(clamp((overT - 0.15) / 0.4, 0, 1));
  ctx.globalAlpha = 1;
  if (bk > 0) retryIcon(CX, by, 32 * bk, overT > 0.4 ? beatPulse() : 0);
  if (overT > 0.4) label('Tap anywhere to retry', CX, by + 52, 14, C.inkSoft, { alpha: 0.8 });
  ctx.restore();
}

computeColors();
(document.fonts ? document.fonts.load(`600 16px ${UI_FONT}`) : Promise.resolve()).finally(() => requestAnimationFrame(frame));
})();
</script>
</body>
</html>
